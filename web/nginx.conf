server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The API is served from the same origin, so the browser never needs CORS.
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite puts a content hash in every asset file name, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes like /groups/123 all serve the single-page app.
  location / {
    try_files $uri /index.html;
  }
}
